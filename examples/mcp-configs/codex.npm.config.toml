# FUTURE, NOT USABLE YET: jev-agent-toolkit-mcp is not published to npm, so
# this config fails until it is. Use codex.local.config.toml today.
#
# Once published: merge into ~/.codex/config.toml, or a project-scoped
# .codex/config.toml.
#
# `env_vars` forwards the named variable from your environment, so no secret is
# written to this file. Use [mcp_servers.jev.env] only for literal non-secret
# values.

[mcp_servers.jev]
command = "npx"
args = ["-y", "jev-agent-toolkit-mcp"]
env_vars = ["TYPESAFE_API_KEY"]
startup_timeout_sec = 10
tool_timeout_sec = 60
